<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimbus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#533afd" />
    <meta name="description" content="Nimbus: AI agents for Salesforce, with approvals, undo and a full record of what the AI saw." />
    <meta property="og:title" content="Nimbus: AI agents for Salesforce" />
    <meta property="og:description" content="Describe the job and get a working agent in under a minute. Approval before every change, one-click undo." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var q = new URLSearchParams(location.search);
        var t = q.get('theme') || localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
        var b = q.get('brand') || localStorage.getItem('brand') || 'ledger'; if (b !== 'classic') document.documentElement.dataset.brand = b;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
