<template>
    <lightning-card>
        <div slot="title" class="head">
            <lightning-icon icon-name="utility:einstein" size="small" class="head-ico"></lightning-icon>
            <div class="head-text">
                <span class="eyebrow">AI case assistant</span>
                <span class="slds-text-heading_small">CRMagents Suggestions</span>
            </div>
        </div>
        <div slot="actions">
            <lightning-button-icon icon-name="utility:refresh" variant="border-filled" alternative-text="Refresh" size="small" onclick={load}></lightning-button-icon>
        </div>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={loading}><lightning-spinner size="small" alternative-text="Loading"></lightning-spinner></template>
            <template lwc:if={error}><p class="slds-text-color_error">{error}</p></template>
            <template lwc:if={empty}>
                <p class="slds-text-color_weak empty">No suggestions for this record yet.</p>
            </template>
            <template lwc:if={latest}>
                <div class="sug">
                    <div class="sug-head">
                        <div class="sug-title">
                            <b>{latest.title}</b>
                            <span class="slds-text-color_weak meta">{latest.by}</span>
                        </div>
                        <span class="badge">AI generated</span>
                    </div>
                    <template lwc:if={latest.isReply}>
                        <p class="reply-meta">To <b>{latest.to}</b><template lwc:if={latest.subject}> · {latest.subject}</template></p>
                        <lightning-textarea class="reply-box" label="Reply" variant="label-hidden" value={latest.draft} onchange={editDraft}></lightning-textarea>
                    </template>
                    <template lwc:else>
                        <div class="sug-body md"><lightning-formatted-rich-text value={latest.html}></lightning-formatted-rich-text></div>
                    </template>
                    <template lwc:if={latest.wasSent}><p class="reply-meta">Sent to {latest.to}</p></template>
                    <template lwc:if={latest.sourceText}><p class="sources"><lightning-icon icon-name="utility:knowledge_base" size="xx-small"></lightning-icon> {latest.sourceText}</p></template>
                    <div class="sug-actions">
                        <template lwc:if={latest.isReply}>
                            <lightning-button variant="brand" label="Send reply" icon-name="utility:email" onclick={sendReply} disabled={sending}></lightning-button>
                        </template>
                        <lightning-button label="Copy" icon-name="utility:copy" onclick={copy}></lightning-button>
                        <lightning-button-icon icon-name="utility:like" variant={helpfulVariant} alternative-text="Helpful" title="Helpful" onclick={helpful}></lightning-button-icon>
                        <lightning-button-icon icon-name="utility:dislike" variant={notHelpfulVariant} alternative-text="Not helpful" title="Not helpful" onclick={notHelpful}></lightning-button-icon>
                        <lightning-button variant="base" label="Dismiss" class="dismiss" onclick={dismiss}></lightning-button>
                    </div>
                    <p class="note">Review AI-generated advice before using it.</p>
                </div>
                <template lwc:if={hasOlder}>
                    <lightning-button variant="base" label={olderLabel} onclick={toggleOlder}></lightning-button>
                    <template lwc:if={showOlder}>
                        <template for:each={older} for:item="s">
                            <div key={s.id} class="sug older">
                                <div class="sug-title"><b>{s.title}</b><span class="slds-text-color_weak meta">{s.by}</span></div>
                                <div class="sug-body md"><lightning-formatted-rich-text value={s.html}></lightning-formatted-rich-text></div>
                            </div>
                        </template>
                    </template>
                </template>
            </template>
            <template lwc:if={hasChanges}>
                <div class="changes-toggle"><lightning-button variant="base" label={changesLabel} onclick={toggleChanges}></lightning-button></div>
                <template lwc:if={showChanges}>
                    <ul class="activity">
                        <template for:each={changes} for:item="c">
                            <li key={c.id}>
                                <div class="act-head"><b>{c.agent}</b> <span class="slds-text-color_weak meta">{c.when} · {c.who}</span>
                                    <template lwc:if={c.failed}><span class="slds-text-color_error meta"> · stopped with an error</span></template></div>
                                <template lwc:if={c.approved}><div class="slds-text-color_weak meta">{c.approved}</div></template>
                                <ul class="act-lines"><template for:each={c.lines} for:item="l"><li key={l.k} class={l.cls}>{l.t}</li></template></ul>
                                <template lwc:if={c.canUndo}>
                                    <lightning-button class="undo" label="Undo" icon-name="utility:undo" data-run={c.id} onclick={undoRun} disabled={undoing}></lightning-button>
                                </template>
                                <template lwc:if={c.undoneNote}><p class="slds-text-color_weak meta undone-note">{c.undoneNote}</p></template>
                            </li>
                        </template>
                    </ul>
                </template>
            </template>
            <div class="copy-host"></div>
        </div>
    </lightning-card>
</template>
