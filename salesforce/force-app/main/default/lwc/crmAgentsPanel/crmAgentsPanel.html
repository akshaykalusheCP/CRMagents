<template>
    <lightning-card title="Nimbus" icon-name="standard:bot">
        <lightning-button-icon slot="actions" icon-name="utility:refresh" variant="border-filled" alternative-text="Refresh" onclick={refresh}></lightning-button-icon>
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={notConnected}>
                <div class="empty">
                    <p class="slds-text-heading_small">Nimbus isn't connected yet</p>
                    <p class="slds-text-color_weak">An admin can connect this org in Nimbus with "Install in Salesforce". It takes a minute.</p>
                </div>
            </template>
            <template lwc:elseif={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert"><span>{error}</span></div>
            </template>

            <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>

            <template lwc:if={ready}>
                <lightning-tabset variant="scoped">
                    <!-- Agents -->
                    <lightning-tab label="Agents">
                        <template lwc:if={run}>
                            <div class="run">
                                <div class="run-head">
                                    <b>{runAgent}</b>
                                    <span class={runTone}>{runLabel}</span>
                                    <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Close" onclick={closeRun} class="slds-col_bump-left"></lightning-button-icon>
                                </div>
                                <template lwc:if={runBusy}><lightning-progress-bar size="small" value="60" variant="circular"></lightning-progress-bar></template>
                                <ul class="steps">
                                    <template for:each={runSteps} for:item="s">
                                        <li key={s.key}><lightning-icon icon-name={s.icon} size="xx-small"></lightning-icon> {s.label}</li>
                                    </template>
                                </ul>
                                <template lwc:if={runWaiting}>
                                    <div class="approve-box">
                                        <p class="slds-text-title_caps">Needs approval</p>
                                        <p class="slds-text-longform pre">{run.approval}</p>
                                        <lightning-button-group>
                                            <lightning-button variant="brand" label="Approve" onclick={approveRun}></lightning-button>
                                            <lightning-button label="Reject" onclick={rejectRun}></lightning-button>
                                        </lightning-button-group>
                                    </div>
                                </template>
                                <template lwc:if={run.output}><div class="output md"><lightning-formatted-rich-text value={runOutputHtml}></lightning-formatted-rich-text></div></template>
                            </div>
                        </template>

                        <template lwc:if={hasAgents}>
                            <ul class="agent-list">
                                <template for:each={agents} for:item="a">
                                    <li key={a.id} class="agent">
                                        <div class="agent-text"><b>{a.name}</b><span class="slds-text-color_weak">{a.hint}</span></div>
                                        <lightning-button label="Run" data-id={a.id} onclick={handleRun} disabled={a.cannotRun}></lightning-button>
                                    </li>
                                </template>
                            </ul>
                            <lightning-button variant="base" label="Add instructions for the run" onclick={toggleInstructions}></lightning-button>
                            <template lwc:if={showInstructions}>
                                <lightning-textarea label="Instructions (optional)" value={instructions} onchange={handleInstructions} placeholder="e.g. Keep the reply short and mention the refund policy"></lightning-textarea>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak empty">{emptyText}</p>
                        </template>

                        <template lwc:if={hasRecent}>
                            <p class="slds-text-title_caps section">Recent on this record</p>
                            <ul class="recent">
                                <template for:each={recent} for:item="r">
                                    <li key={r.runId}><b>{r.agent}</b> · {r.label} <span class="slds-text-color_weak">· {r.when}</span></li>
                                </template>
                            </ul>
                        </template>
                    </lightning-tab>

                    <!-- Ask -->
                    <lightning-tab label="Ask">
                        <template lwc:if={hasAssistants}>
                            <lightning-combobox label="Assistant" value={assistantId} options={assistants} onchange={handleAssistant}></lightning-combobox>
                            <template lwc:if={hasNotes}>
                                <div class="rec-notes">
                                    <span class="rec-notes-h">What agents know about this record</span>
                                    <ul><template for:each={notes} for:item="n"><li key={n.key}>{n.text} <span class="slds-text-color_weak">· {n.by}</span></li></template></ul>
                                </div>
                            </template>
                            <template lwc:if={resumed}><p class="resumed slds-text-color_weak">Continuing your last conversation here.</p></template>
                            <div class="thread">
                                <template for:each={messages} for:item="m">
                                    <div key={m.key} class={m.css}>
                                        <template lwc:if={m.mine}>
                                            <template for:each={m.pics} for:item="p"><img key={p.key} src={p.src} class="bubble-img" alt=""></template>
                                            {m.text}
                                        </template>
                                        <template lwc:else><lightning-formatted-rich-text value={m.html}></lightning-formatted-rich-text></template>
                                    </div>
                                    <template lwc:if={m.canRead}>
                                        <lightning-button key={m.readKey} variant="base" class="read-btn" label={m.readLabel} icon-name={m.readIcon} data-index={m.key} onclick={readMessage}></lightning-button>
                                    </template>
                                    <template for:each={m.memory} for:item="r"><p key={r.key} class="mem-note">{r.text}</p></template>
                                </template>
                                <template lwc:if={asking}><div class="bubble ai weak">Looking it up…</div></template>
                            </div>
                            <template lwc:if={hasImages}>
                                <div class="img-chips">
                                    <template for:each={images} for:item="im">
                                        <span key={im.key} class="img-chip" title={im.name}>
                                            <img src={im.preview} alt={im.name}>
                                            <button type="button" class="img-x" data-key={im.key} onclick={removeImage} aria-label="Remove image">×</button>
                                        </span>
                                    </template>
                                    <span class="slds-text-color_weak img-note">Images go to the AI as they are.</span>
                                </div>
                            </template>
                            <div onpaste={handlePaste}>
                                <lightning-textarea label="Question" variant="label-hidden" value={question} onchange={handleQuestion} onkeydown={handleQuestionKey} placeholder={questionPlaceholder}></lightning-textarea>
                            </div>
                            <input type="file" class="img-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple onchange={handleFiles} hidden>
                            <div class="ask-actions">
                                <lightning-button variant="base" label="New conversation" onclick={newConversation}></lightning-button>
                                <div class="ask-right">
                                    <lightning-button-icon icon-name="utility:image" variant="border-filled" alternative-text="Attach an image" title="Attach an image (or paste a screenshot)" onclick={pickImages} disabled={cannotAttach}></lightning-button-icon>
                                    <template lwc:if={canListen}>
                                        <lightning-button-icon icon-name={micIcon} variant={micVariant} alternative-text={micLabel} title={micLabel} onclick={toggleListen}></lightning-button-icon>
                                    </template>
                                    <lightning-button variant="brand" label="Ask" onclick={send} disabled={cannotAsk}></lightning-button>
                                </div>
                            </div>
                            <template lwc:if={canSpeak}>
                                <lightning-input type="checkbox" class="read-aloud" label="Read answers aloud" checked={readAloud} onchange={handleReadAloud}></lightning-input>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak empty">No assistants yet. Create one in Nimbus under Agents → Assistants.</p>
                        </template>
                    </lightning-tab>

                    <!-- Approvals -->
                    <lightning-tab label={approvalsLabel}>
                        <template lwc:if={hasApprovals}>
                            <template for:each={approvals} for:item="a">
                                <div key={a.runId} class="approve-box">
                                    <div class="run-head"><b>{a.agent}</b><span class="slds-text-color_weak">· for {a.assignedLabel}</span></div>
                                    <ul class="changes">
                                        <template for:each={a.lines} for:item="l"><li key={l.key}>{l.text}</li></template>
                                    </ul>
                                    <lightning-input label="Note (optional)" value={a.note} data-id={a.runId} onchange={handleNote}></lightning-input>
                                    <div class="ask-actions">
                                        <lightning-button label="Reject" data-id={a.runId} onclick={handleReject} disabled={a.busy}></lightning-button>
                                        <lightning-button variant="brand" label="Approve" data-id={a.runId} onclick={handleApprove} disabled={a.busy}></lightning-button>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak empty">Nothing waiting. Agents ask here before changing anything.</p>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </template>
        </div>
    </lightning-card>
</template>
